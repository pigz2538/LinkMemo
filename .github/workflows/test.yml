name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cloud function dependencies
        run: npm install --prefix cloudfunctions/api --no-audit --no-fund

      - name: Check server syntax
        run: npm run check:server

      - name: Run tests
        run: npm test
